<script>
/* ---------- Speech setup ---------- */
const synth = (typeof window !== 'undefined' && window.speechSynthesis) ? window.speechSynthesis : null;
let frVoice = null;
function loadVoice(){
  if(!synth) return;
  try{
    const voices = synth.getVoices();
    frVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('fr')) || null;
  }catch(e){ /* ignore — playback will just use default voice/lang */ }
}
try{ loadVoice(); }catch(e){}
if (synth){ try{ synth.onvoiceschanged = loadVoice; }catch(e){} }

function speak(text){
  if(!synth){
    alert("This browser doesn't support text-to-speech playback.");
    return;
  }
  try{ synth.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  if(frVoice) u.voice = frVoice;
  u.rate = 0.92;
  u.onerror = (e)=>{
    console.log('TTS error', e);
  };
  try{ synth.speak(u); }catch(e){ alert('Playback failed: '+ (e.message||e)); }
}
function hasFrenchVoice(){
  if(!synth) return false;
  try{
    const voices = synth.getVoices();
    return voices.some(v=>v.lang && v.lang.toLowerCase().startsWith('fr'));
  }catch(e){ return false; }
}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let recognizing = false;
function getRecognizer(onResult, onEnd){
  if(!SpeechRecognitionAPI) return null;
  const r = new SpeechRecognitionAPI();
  r.lang = 'fr-FR';
  r.interimResults = false;
  r.maxAlternatives = 3;
  r.onresult = (e)=>{
    const alts = [];
    for(let i=0;i<e.results[0].length;i++){ alts.push(e.results[0][i].transcript); }
    onResult(alts);
  };
  r.onend = ()=>{ recognizing=false; if(onEnd) onEnd(); };
  r.onerror = (e)=>{ recognizing=false; if(onEnd) onEnd(e.error || 'error'); };
  return r;
}

function normalize(s){
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[.,!?;:'"’]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function isMatch(target, said){
  return normalize(target) === normalize(said);
}
function keywordMatch(said, keywordSets){
  const n = normalize(said);
  return keywordSets.some(set => set.every(kw => n.includes(normalize(kw))));
}

/* ---------- Spaced repetition (research-based intervals) ----------
   Box 0: due immediately (new/failed)  Box 1: +1 day  Box 2: +3 days
   Box 3: +7 days  Box 4: +14 days  Box 5: +30 days (mastered)
   A wrong answer always drops back to box 0 (immediate re-review). */
const SRS_INTERVALS_DAYS = [0, 1, 3, 7, 14, 30];
const MS_DAY = 24*60*60*1000;

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem('frt_progress')||'{}'); }
  catch(e){ return {}; }
}
function saveProgress(p){ try{ localStorage.setItem('frt_progress', JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();

function getItemProgress(key){
  return progress[key] || { box: 0, nextDue: 0 };
}
function updateProgress(key, ok){
  const cur = getItemProgress(key);
  const newBox = ok ? Math.min(cur.box + 1, SRS_INTERVALS_DAYS.length - 1) : 0;
  const nextDue = Date.now() + SRS_INTERVALS_DAYS[newBox] * MS_DAY;
  progress[key] = { box: newBox, nextDue };
  saveProgress(progress);
}
function isDue(key){
  return getItemProgress(key).nextDue <= Date.now();
}
function stageInfo(box){
  if(box===0) return {label:'New', cls:'stage-new'};
  if(box<=2) return {label:'Learning', cls:'stage-learning'};
  if(box<=4) return {label:'Reviewing', cls:'stage-reviewing'};
  return {label:'Mastered', cls:'stage-mastered'};
}

/* ---------- Streak tracking ---------- */
function loadMeta(){
  try{ return JSON.parse(localStorage.getItem('frt_meta')||'{"lastActive":null,"streak":0}'); }
  catch(e){ return {lastActive:null, streak:0}; }
}
function saveMeta(m){ try{ localStorage.setItem('frt_meta', JSON.stringify(m)); }catch(e){} }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  const m = loadMeta();
  const today = todayStr();
  if(m.lastActive === today) return m;
  const yesterday = new Date(Date.now() - MS_DAY).toISOString().slice(0,10);
  m.streak = (m.lastActive === yesterday) ? (m.streak||0) + 1 : 1;
  m.lastActive = today;
  saveMeta(m);
  return m;
}

/* ---------- Unified item list (vocab + verbs + sentences + conversation) ---------- */
function getAllItems(){
  const items = [];
  allVocab().forEach(v=> items.push({key:'vocab:'+v.fr, fr:v.fr, en:v.en, source:'Vocabulaire'}));
  allSentences().forEach(s=> items.push({key:'sent:'+s.fr, fr:s.fr, en:s.en, source:'Phrases'}));
  VERBS.forEach(verb=>{
    ['present','pc'].forEach(mode=>{
      const forms = mode==='present' ? verb.present : verb.pc;
      if(!forms) return;
      Object.keys(forms).forEach(subj=>{
        const full = (subj==='je' && forms[subj][0].match(/[aeiouyéèêh]/i)) ? "J'"+forms[subj] : SUBJECTS[subj]+' '+forms[subj];
        items.push({key:'verb:'+verb.inf+':'+mode+':'+subj, fr:full, en:verb.en+' ('+SUBJECTS[subj]+')', source:'Verbes'});
      });
    });
  });
  Object.keys(CONVERSATION).forEach(examKey=>{
    CONVERSATION[examKey].tasks.forEach((task,ti)=>{
      task.prompts.forEach((p,pi)=>{
        items.push({key:'conv:'+examKey+':'+ti+':'+pi, fr:p.fr, en:p.en, source:'Conversation', keywordSets:p.keywords, model:p.model});
      });
    });
  });
  return items;
}
function buildSession(maxSize){
  maxSize = maxSize || 20;
  let all = getAllItems();
  if(!sentencesUnlocked()) all = all.filter(i=>i.source!=='Phrases');
  if(!conversationUnlocked()) all = all.filter(i=>i.source!=='Conversation');
  const due = all.filter(i=>isDue(i.key));
  const reviews = due.filter(i=>getItemProgress(i.key).box>0);
  const fresh = due.filter(i=>getItemProgress(i.key).box===0);
  return { queue: reviews.concat(fresh).slice(0, maxSize), totalDue: due.length };
}

/* ---------- Progression gate: Vocab -> Sentences -> Conversation (TCF/TEF) ----------
   A word counts as "solid" once its box reaches 2 (gotten right twice running).
   Sentences unlock once enough vocab is solid; Conversation unlocks once enough
   sentences AND verb forms are solid — mirrors how real acquisition builds up. */
const UNLOCK = {
  sentences: { vocabSolid: 20 },
  conversation: { sentSolid: 8, verbSolid: 10 }
};
function countSolid(prefix, minBox){
  minBox = minBox===undefined ? 2 : minBox;
  return getAllItems().filter(i=>i.key.startsWith(prefix) && getItemProgress(i.key).box>=minBox).length;
}
function sentencesUnlocked(){ return countSolid('vocab:') >= UNLOCK.sentences.vocabSolid; }
function conversationUnlocked(){
  return countSolid('sent:') >= UNLOCK.conversation.sentSolid && countSolid('verb:') >= UNLOCK.conversation.verbSolid;
}

    <div class="session-bar-track"><div class="session-bar-fill" style="width:${pct}%"></div></div>

}

/* ---------- Practice widget (shared) ---------- */
function practiceWidget(targetText, onCorrect, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  const micSupported = !!SpeechRecognitionAPI;

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  const playBtn = document.createElement('button');
  playBtn.className = 'action btn-play';
  playBtn.innerHTML = '🔊 Hear it';
  playBtn.onclick = ()=> speak(targetText);
  btnRow.appendChild(playBtn);

  const micBtn = document.createElement('button');
  micBtn.className = 'action btn-mic';
  micBtn.innerHTML = micSupported ? '🎤 Say it' : '🎤 Not supported';
  micBtn.disabled = !micSupported;
  btnRow.appendChild(micBtn);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';

  micBtn.onclick = ()=>{
    if(recognizing) return;
    recognizing = true;
    micBtn.classList.add('listening');
    micBtn.innerHTML = '🔴 Listening...';
    const rec = getRecognizer((alts)=>{
      const said = alts[0] || '';
      let ok;
      if(opts.keywordSets){
        ok = alts.some(a=>keywordMatch(a, opts.keywordSets));
      } else {
        ok = alts.some(a=>isMatch(targetText, a));
      }
      recordAttempt(ok);
      if(opts.progressKey){ updateProgress(opts.progressKey, ok); }
      feedback.className = 'feedback ' + (ok ? 'good' : 'bad');
      feedback.innerHTML = (ok ? '✅ Nice — that matched!' : '❌ Not quite — listen again and retry.') +
        '<div class="heard">You said: "' + said + '"</div>';
      if(ok && onCorrect) onCorrect();
      if(!ok){ setTimeout(()=>speak(targetText), 400); }
    }, (err)=>{
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎤 Say it';
      if(err){
        feedback.className = 'feedback bad';
        let msg = "⚠️ Couldn't hear you — try again.";
        if(err === 'not-allowed' || err === 'service-not-allowed'){
          msg = "⚠️ Microphone permission is blocked. Tap the 🔒/ⓘ icon next to the address bar → Permissions → Microphone → Allow, then reload the page.";
        } else if(err === 'no-speech'){
          msg = "⚠️ Didn't catch any speech — tap 🎤 and speak right after it turns red.";
        } else if(err === 'audio-capture'){
          msg = "⚠️ No microphone was found. Check that no other app is using it.";
        } else if(err === 'network'){
          msg = "⚠️ Speech recognition needs an internet connection — check your connection and retry.";
        }
        feedback.innerHTML = msg;
      }
    });
    if(!rec){ recognizing=false; return; }
    recognizer = rec;
    try{ rec.start(); }catch(e){ recognizing=false; }
    rec.onend = ()=>{
      recognizing = false;
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎤 Say it';
    };
  };

  wrap.appendChild(btnRow);
  wrap.appendChild(feedback);
  return wrap;
}

    breakdown.className = 'card';
    breakdown.innerHTML = '<p class="item-en" style="margin-bottom:6px;">What\'s due, by type</p>';
    ['Vocabulaire','Verbes','Phrases','Conversation'].forEach(src=>{
      if(!bySource[src]) return;
      const row = document.createElement('div');
      row.className = 'source-row';
      row.innerHTML = `<span>${src}</span><span>${bySource[src]}</span>`;
      breakdown.appendChild(row);
    });
    main.appendChild(breakdown);
  }

  const howCard = document.createElement('div');
  howCard.className = 'card';
  howCard.innerHTML = `
    <p class="item-en" style="margin-bottom:4px;">How this works</p>
    <p class="how-it-works">
      Every word, verb form, sentence, and conversation line you practice gets scheduled automatically.
      Get it right → it comes back further away (tomorrow, then in 3 days, then a week, then two weeks).
      Get it wrong → it comes back today, so you fix it before it turns into a bad habit.<br><br>
      You don't need to think about any of this — just tap <b>Start Today's Session</b> each day and do
      whatever it gives you. Browse Vocab / Verbs / Sentences / Talk any time you want extra practice
      beyond the daily session.
    </p>
  `;
  main.appendChild(howCard);

  const pathCard = document.createElement('div');
  pathCard.className = 'card';
  pathCard.innerHTML = '<p class="item-en" style="margin-bottom:8px;">Your path</p>';
  const vocabSolid = countSolid('vocab:');
  const sentUnlocked = sentencesUnlocked();
  const sentSolid = countSolid('sent:');
  const verbSolid = countSolid('verb:');
  const convUnlocked = conversationUnlocked();

  function pathStep(label, done, current, needed, note){
    const pct = Math.min(100, Math.round((current/needed)*100));
    const row = document.createElement('div');
    row.style.marginBottom = '14px';
    row.innerHTML = `
      <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:4px;">
        <span>${done ? '✅' : '🔒'} ${label}</span>
        <span class="small">${current}/${needed}</span>
      </div>
      <div class="session-bar-track"><div class="session-bar-fill" style="width:${pct}%"></div></div>
      <p class="small" style="margin-top:4px;">${note}</p>
    `;
    return row;
  }
  pathCard.appendChild(pathStep('1. Vocabulary', true, vocabSolid, UNLOCK.sentences.vocabSolid, 'Words practiced solidly (Learning stage or beyond).'));
  pathCard.appendChild(pathStep('2. Sentences', sentUnlocked, vocabSolid, UNLOCK.sentences.vocabSolid,
    sentUnlocked ? 'Unlocked — full sentences from your lessons.' : 'Unlocks once enough vocabulary is solid.'));
  pathCard.appendChild(pathStep('3. Conversation (TCF/TEF)', convUnlocked, sentSolid + verbSolid,
    UNLOCK.conversation.sentSolid + UNLOCK.conversation.verbSolid,
    convUnlocked ? 'Unlocked — real TCF/TEF-style conversation practice.' : 'Unlocks once sentences and verb forms are solid.'));
  main.appendChild(pathCard);
}

/* ---------- Daily session (unified review across all tabs) ---------- */
function renderSession(main, nav){
  nav.innerHTML = '';
  main.innerHTML = '';

  if(sessionIdx >= sessionQueue.length){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <p class="item-en" style="margin-bottom:0;">🎉 Session complete</p>
      <div class="hero-num">${sessionCorrect}/${sessionQueue.length}</div>
      <div class="hero-label">correct this session</div>
    `;
    const backBtn = document.createElement('button');
    backBtn.className = 'big-btn';
    backBtn.textContent = 'Back to Home';
    backBtn.onclick = ()=>{ currentTab='home'; render(); };
    card.appendChild(backBtn);
    main.appendChild(card);
    return;
  }

  const item = sessionQueue[sessionIdx];
  const pct = Math.round((sessionIdx / sessionQueue.length) * 100);

  const bar = document.createElement('div');
  bar.className = 'session-bar-track';
  bar.innerHTML = `<div class="session-bar-fill" style="width:${pct}%"></div>`;
  main.appendChild(bar);

  const card = document.createElement('div');
  card.className = 'card';
  const stage = stageInfo(getItemProgress(item.key).box);
  card.innerHTML = `
    <div class="pill">${item.source}</div>
    <span class="stage-pill ${stage.cls}">${stage.label}</span>
    <div class="progress-line" style="margin-top:8px;">Item ${sessionIdx+1} of ${sessionQueue.length}</div>
    <p class="item-fr" style="font-size:1.2rem;">${item.fr}</p>
    <p class="item-en">${item.en}</p>
  `;

  const opts = item.keywordSets ? {keywordSets: item.keywordSets, progressKey: item.key} : {progressKey: item.key};
  const widget = practiceWidget(item.fr, ()=>{
    sessionCorrect++;
    setTimeout(()=>{ sessionIdx++; render(); }, 900);
  }, opts);
  card.appendChild(widget);

  if(item.model){
    const modelBtn = document.createElement('button');
    modelBtn.className = 'action btn-ghost';
    modelBtn.style.marginTop = '10px';
    modelBtn.textContent = 'Show model answer';
    const modelBox = document.createElement('div');
    modelBox.className = 'model-answer';
    modelBox.innerHTML = `<b>Model answer:</b><br>${item.model}`;
    modelBtn.onclick = ()=>{
      modelBox.classList.toggle('show');
      if(modelBox.classList.contains('show')) speak(item.model);
    };
    card.appendChild(modelBtn);
    card.appendChild(modelBox);
  }

  const skipRow = document.createElement('div');
  skipRow.className = 'btn-row';
  const skipBtn = document.createElement('button');
  skipBtn.className = 'action btn-ghost';
  skipBtn.textContent = 'Skip →';
  skipBtn.onclick = ()=>{ sessionIdx++; render(); };
  skipRow.appendChild(skipBtn);
  card.appendChild(skipRow);

  main.appendChild(card);
}

/* ---------- Vocab tab ---------- */
function renderVocab(main, nav){
  const cats = ['Tous', ...new Set(allVocab().map(v=>v.cat))];
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.textContent = c;
    if(c===vocabCat && !vocabDueOnly) b.classList.add('active');
    b.onclick = ()=>{ vocabCat=c; vocabDueOnly=false; vocabIndex=0; render(); };
    nav.appendChild(b);
  });
  const dueBtn = document.createElement('button');
  const dueCount = allVocab().filter(v=>isDue('vocab:'+v.fr)).length;
  dueBtn.textContent = '📅 Due (' + dueCount + ')';
  if(vocabDueOnly) dueBtn.classList.add('active');
  dueBtn.onclick = ()=>{ vocabDueOnly=true; vocabIndex=0; render(); };
  nav.appendChild(dueBtn);

  let list = vocabCat==='Tous' ? allVocab() : allVocab().filter(v=>v.cat===vocabCat);
  if(vocabDueOnly) list = allVocab().filter(v=>isDue('vocab:'+v.fr));
  if(vocabIndex>=list.length) vocabIndex=0;
  const item = list[vocabIndex];

  main.innerHTML = '';
  if(!item){
    main.innerHTML = vocabDueOnly
      ? '<div class="card"><p class="item-en">Nothing due right now — nice work staying on top of reviews. Check back later, or browse a category to learn new words.</p></div>'
      : '<div class="card">No words yet in this category.</div>';
    return;
  }

  const key = 'vocab:'+item.fr;
  const stage = stageInfo(getItemProgress(key).box);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="pill">${item.cat}</div>
    <span class="stage-pill ${stage.cls}">${stage.label}</span>
    <div class="progress-line" style="margin-top:8px;">${vocabDueOnly ? 'Due review' : 'Word'} ${vocabIndex+1} of ${list.length}</div>
    <p class="item-fr">${item.fr}</p>
    <p class="item-en">${item.en}</p>
  `;
  const widget = practiceWidget(item.fr, ()=>{
    setTimeout(()=>{ vocabIndex = (vocabIndex+1)%list.length; render(); }, 900);
  }, {progressKey: key});
  card.appendChild(widget);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const skipBtn = document.createElement('button');
  skipBtn.className = 'action btn-ghost';
  skipBtn.textContent = 'Skip →';
  skipBtn.onclick = ()=>{ vocabIndex=(vocabIndex+1)%list.length; render(); };
  nextRow.appendChild(skipBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Verbs tab ---------- */
function renderVerbs(main, nav){
  ['present','pc'].forEach(mode=>{
    const b = document.createElement('button');
    b.textContent = mode==='present' ? 'Présent' : 'Passé composé';
    if(mode===verbMode) b.classList.add('active');
    b.onclick = ()=>{ verbMode=mode; render(); };
    nav.appendChild(b);
  });

  const verbsAvailable = VERBS.filter(v=> verbMode==='present' || v.pc);
  if(verbIndex>=verbsAvailable.length) verbIndex=0;
  const verb = verbsAvailable[verbIndex];
  const forms = verbMode==='present' ? verb.present : verb.pc;

  main.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="progress-line">Verb ${verbIndex+1} of ${verbsAvailable.length}</div>
    <p class="item-fr">${verb.inf}</p>
    <p class="item-en">${verb.en}</p>
  `;

  const grid = document.createElement('div');
  grid.className = 'conj-grid';
  Object.keys(forms).forEach(subj=>{
    const cell = document.createElement('div');
    cell.className = 'conj-cell';
    const full = (subj==='je' && forms[subj][0].match(/[aeiouyéèêh]/i)) ? "J'"+forms[subj] : SUBJECTS[subj]+' '+forms[subj];
    cell.innerHTML = `<b>${SUBJECTS[subj]}</b>${full}`;
    grid.appendChild(cell);
  });
  card.appendChild(grid);

  const sel = document.createElement('div');
  sel.className = 'small';
  sel.textContent = 'Tap a pronoun below to practice that form:';
  card.appendChild(sel);

  const pronRow = document.createElement('div');
  pronRow.className = 'sub-tabs';
  let activeSubj = Object.keys(forms)[0];
  Object.keys(forms).forEach(subj=>{
    const b = document.createElement('button');
    b.textContent = SUBJECTS[subj];
    if(subj===activeSubj) b.classList.add('active');
    b.onclick = ()=>{ activeSubj=subj; buildPractice(); };
    pronRow.appendChild(b);
  });
  card.appendChild(pronRow);

  const practiceHolder = document.createElement('div');
  card.appendChild(practiceHolder);

  function buildPractice(){
    pronRow.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.textContent===SUBJECTS[activeSubj]));
    practiceHolder.innerHTML = '';
    const full = (activeSubj==='je' && forms[activeSubj][0].match(/[aeiouyéèêh]/i)) ? "J'"+forms[activeSubj] : SUBJECTS[activeSubj]+' '+forms[activeSubj];
    const vKey = 'verb:'+verb.inf+':'+verbMode+':'+activeSubj;
    const stage = stageInfo(getItemProgress(vKey).box);
    const stageEl = document.createElement('span');
    stageEl.className = 'stage-pill ' + stage.cls;
    stageEl.textContent = stage.label;
    stageEl.style.marginBottom = '8px';
    stageEl.style.display = 'inline-block';
    practiceHolder.appendChild(stageEl);
    practiceHolder.appendChild(document.createElement('br'));
    practiceHolder.appendChild(practiceWidget(full, null, {progressKey: vKey}));
  }
  buildPractice();

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action btn-next';
  nextBtn.textContent = 'Next verb →';
  nextBtn.onclick = ()=>{ verbIndex=(verbIndex+1)%verbsAvailable.length; render(); };
  nextRow.appendChild(nextBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Sentences tab ---------- */
function renderSentences(main, nav){
  nav.innerHTML = '';
  if(!sentencesUnlocked()){
    lockedCard(main, 'Sentences', countSolid('vocab:'), UNLOCK.sentences.vocabSolid,
      "Get a bit more vocabulary solid first — sentences are built from words you already know, so this unlocks once you've got enough vocab under your belt.",
      'vocab', 'Go practice Vocab');
    return;
  }
  const dueCount = allSentences().filter(s=>isDue('sent:'+s.fr)).length;
  nav.innerHTML = '<span class="small" style="padding:8px 4px;">Full sentences from your lessons</span>';
  const dueBtn = document.createElement('button');
  dueBtn.textContent = '📅 Due (' + dueCount + ')';
  if(sentDueOnly) dueBtn.classList.add('active');
  dueBtn.onclick = ()=>{ sentDueOnly = !sentDueOnly; sentIndex=0; render(); };
  nav.appendChild(dueBtn);

  let list = sentDueOnly ? allSentences().filter(s=>isDue('sent:'+s.fr)) : allSentences();
  if(sentIndex>=list.length) sentIndex=0;
  const s = list[sentIndex];

  main.innerHTML = '';
  if(!s){
    main.innerHTML = '<div class="card"><p class="item-en">Nothing due right now — check back later.</p></div>';
    return;
  }
  const key = 'sent:'+s.fr;
  const stage = stageInfo(getItemProgress(key).box);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <span class="stage-pill ${stage.cls}">${stage.label}</span>
    <div class="progress-line" style="margin-top:8px;">Sentence ${sentIndex+1} of ${list.length}</div>
    <p class="item-fr" style="font-size:1.15rem;">${s.fr}</p>
    <p class="item-en">${s.en}</p>
  `;
  const widget = practiceWidget(s.fr, ()=>{
    setTimeout(()=>{ sentIndex=(sentIndex+1)%list.length; render(); }, 900);
  }, {progressKey: key});
  card.appendChild(widget);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const skipBtn = document.createElement('button');
  skipBtn.className = 'action btn-ghost';
  skipBtn.textContent = 'Skip →';
  skipBtn.onclick = ()=>{ sentIndex=(sentIndex+1)%list.length; render(); };
  nextRow.appendChild(skipBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Conversation tab ---------- */
function renderConversation(main, nav){
  nav.innerHTML = '';
  if(!conversationUnlocked()){
    const need = Math.max(UNLOCK.conversation.sentSolid - countSolid('sent:'), 0) +
                 Math.max(UNLOCK.conversation.verbSolid - countSolid('verb:'), 0);
    lockedCard(main, 'Conversation (TCF/TEF)',
      countSolid('sent:') + countSolid('verb:'),
      UNLOCK.conversation.sentSolid + UNLOCK.conversation.verbSolid,
      "Real conversation needs solid sentences and verb conjugation behind it — get more of those locked in and this unlocks automatically.",
      'sentences', 'Go practice Sentences');
    return;
  }
  Object.keys(CONVERSATION).forEach(key=>{
    const b = document.createElement('button');
    b.textContent = CONVERSATION[key].label;
    if(key===convExam) b.classList.add('active');
    b.onclick = ()=>{ convExam=key; convTaskIdx=0; convPromptIdx=0; render(); };
    nav.appendChild(b);
  });

  const exam = CONVERSATION[convExam];
  const task = exam.tasks[convTaskIdx];
  const prompt = task.prompts[convPromptIdx];

  main.innerHTML = '';

  const taskNav = document.createElement('div');
  taskNav.className = 'sub-tabs';
  exam.tasks.forEach((t,i)=>{
    const b = document.createElement('button');
    b.textContent = t.title.split('—')[0].trim();
    if(i===convTaskIdx) b.classList.add('active');
    b.onclick = ()=>{ convTaskIdx=i; convPromptIdx=0; render(); };
    taskNav.appendChild(b);
  });
  main.appendChild(taskNav);

  const key = 'conv:'+convExam+':'+convTaskIdx+':'+convPromptIdx;
  const stage = stageInfo(getItemProgress(key).box);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="pill">${task.title}</div>
    <span class="stage-pill ${stage.cls}">${stage.label}</span>
    <p class="small" style="margin-top:8px;">${task.desc}</p>
    <div class="progress-line">Question ${convPromptIdx+1} of ${task.prompts.length}</div>
    <p class="item-fr" style="font-size:1.15rem;">${prompt.fr}</p>
    <p class="item-en">${prompt.en}</p>
  `;

  const widget = practiceWidget(prompt.fr, null, {keywordSets: prompt.keywords, progressKey: key});
  card.appendChild(widget);

  const modelBtn = document.createElement('button');
  modelBtn.className = 'action btn-ghost';
  modelBtn.style.marginTop = '10px';
  modelBtn.textContent = 'Show model answer';
  const modelBox = document.createElement('div');
  modelBox.className = 'model-answer';
  modelBox.innerHTML = `<b>Model answer:</b><br>${prompt.model}`;
  modelBtn.onclick = ()=>{
    modelBox.classList.toggle('show');
    if(modelBox.classList.contains('show')) speak(prompt.model);
  };
  card.appendChild(modelBtn);
  card.appendChild(modelBox);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action btn-next';
  nextBtn.textContent = 'Next question →';
  nextBtn.onclick = ()=>{
    convPromptIdx++;
    if(convPromptIdx>=task.prompts.length){ convPromptIdx=0; }
    render();
  };
  nextRow.appendChild(nextBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Add tab ---------- */
function renderAdd(main, nav){
  nav.innerHTML = '<span class="small" style="padding:8px 4px;">Add words or sentences from each lesson</span>';
  main.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <p class="item-en" style="margin-bottom:10px;">Add a new item</p>
    <select id="addType">
      <option value="vocab">Vocabulary word</option>
      <option value="sentences">Full sentence</option>
    </select>
    <input type="text" id="addFr" placeholder="French (e.g. le stylo)">
    <input type="text" id="addEn" placeholder="English meaning">
    <input type="text" id="addCat" placeholder="Category (vocab only, e.g. Verbes)">
    <div class="btn-row">
      <button class="action btn-next" id="addBtn">Add</button>
    </div>
  `;
  main.appendChild(card);

  document.getElementById('addBtn').onclick = ()=>{
    const type = document.getElementById('addType').value;
    const fr = document.getElementById('addFr').value.trim();
    const en = document.getElementById('addEn').value.trim();
    const cat = document.getElementById('addCat').value.trim() || 'Ajouté';
    if(!fr || !en) return;
    if(type==='vocab'){ custom.vocab.push({cat, fr, en}); }
    else{ custom.sentences.push({fr, en}); }
    saveCustom(custom);
    document.getElementById('addFr').value='';
    document.getElementById('addEn').value='';
    document.getElementById('addCat').value='';
    renderAddList();
  };

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.id = 'addListCard';
  main.appendChild(listCard);
  renderAddList();

  function renderAddList(){
    const lc = document.getElementById('addListCard');
    lc.innerHTML = '<p class="item-en">Your added items</p>';
    const combined = [
      ...custom.vocab.map((v,i)=>({...v, kind:'vocab', idx:i})),
      ...custom.sentences.map((s,i)=>({...s, kind:'sentences', idx:i}))
    ];
    if(combined.length===0){ lc.innerHTML += '<p class="small">Nothing added yet.</p>'; return; }
    combined.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `<span>${item.fr} <span class="small">— ${item.en}</span></span>`;
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.onclick = ()=>{
        custom[item.kind].splice(item.idx,1);
        saveCustom(custom);
        renderAddList();
      };
      row.appendChild(del);
      lc.appendChild(row);
    });
  }
}

/* ---------- Init ---------- */
try{
  if(!SpeechRecognitionAPI){
    const w = document.createElement('div');
    w.className = 'warn';
    w.innerHTML = '⚠️ Speech recognition isn\'t supported in this browser. Use <b>Chrome on Android</b> for the "Say it" mic feature — pronunciation playback will still work everywhere.';
    document.body.insertBefore(w, document.getElementById('mainNav').nextSibling);
  }
}catch(e){}

function checkVoiceAvailability(){
  if(!synth) return;
  if(!hasFrenchVoice()){
    if(document.getElementById('noVoiceWarn')) return;
    const w = document.createElement('div');
    w.className = 'warn';
    w.id = 'noVoiceWarn';
    w.innerHTML = '⚠️ No French voice found on this device, so "Hear it" will stay silent. Install one: Android Settings → System → Languages & input → Text-to-speech output → Google Text-to-Speech → Install voice data → French.';
    document.body.insertBefore(w, document.getElementById('mainNav').nextSibling);
  } else {
    const existing = document.getElementById('noVoiceWarn');
    if(existing) existing.remove();
  }
}
setTimeout(checkVoiceAvailability, 600);
if(synth){ try{ synth.addEventListener('voiceschanged', checkVoiceAvailability); }catch(e){} }

try{
  render();
}catch(e){
  document.getElementById('mainContent').innerHTML =
    '<div class="card"><p class="item-en">Something didn\'t load right: ' +
    (e && e.message ? e.message : 'unknown error') +
    '</p><p class="small">Try reloading the page.</p></div>';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if unavailable, e.g. on claude.ai preview */ });
  });
}
