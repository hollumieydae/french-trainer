  card.appendChild(resultBox);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action btn-ghost';
  nextBtn.textContent = 'Next passage →';
  nextBtn.onclick = ()=>{ readingIdx = (readingIdx+1) % READING_PASSAGES.length; render(); };
  nextRow.appendChild(nextBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

function renderWriting(main, nav){
  nav.innerHTML = '';
  main.innerHTML = '';

  const infoCard = document.createElement('div');
  infoCard.className = 'card';
  infoCard.innerHTML = `
    <p class="item-en" style="margin-bottom:4px;">Expression Écrite — Writing</p>
    <p class="small" style="margin-bottom:10px;">
      The real exam has 3 writing tasks (60 min total, word counts vary slightly by
      source: roughly 80–120 / 120–150 / 180–220 words). Official correctors (trained
      by France Éducation International) grade on 4 criteria: <b>adéquation</b> (did you
      answer the prompt), <b>structure</b>, <b>lexique</b> (vocabulary), and
      <b>correction de la langue</b> (grammar accuracy). Target for NCLC 7 (your CLB 7
      goal) is roughly 10–11/20.
    </p>
    <p class="small">
      The warm-ups below are simplified A1 versions using words you've already learned.
      "Check grammar" below gives real automated feedback on the <i>correction de la
      langue</i> criterion — the other three still need your own judgment (checklist below).
    </p>
  `;
  main.appendChild(infoCard);

  if(writingIdx >= WRITING_WARMUPS_A1.length) writingIdx = 0;
  const item = WRITING_WARMUPS_A1[writingIdx];
  const practiced = !!writingLog[writingIdx];

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="progress-line">Warm-up ${writingIdx+1} of ${WRITING_WARMUPS_A1.length}${practiced ? ' · ✅ practiced' : ''}</div>
    <p class="item-en" style="font-size:1rem; margin-bottom:10px;">${item.prompt}</p>
  `;

  const textarea = document.createElement('textarea');
  textarea.rows = 5;
  textarea.placeholder = 'Write your response in French here...';
  card.appendChild(textarea);

  const wordCount = document.createElement('p');
  wordCount.className = 'small';
  wordCount.style.marginTop = '2px';
  wordCount.textContent = '0 words';
  textarea.addEventListener('input', ()=>{
    const n = textarea.value.trim().split(/\s+/).filter(Boolean).length;
    wordCount.textContent = n + ' words';
  });
  card.appendChild(wordCount);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  const grammarBtn = document.createElement('button');
  grammarBtn.className = 'action btn-mic';
  grammarBtn.textContent = '✓ Check grammar';
  const grammarResults = document.createElement('div');
  grammarResults.style.marginTop = '10px';
  grammarBtn.onclick = async ()=>{
    if(!textarea.value.trim()){ grammarResults.innerHTML = '<p class="small">Write something first.</p>'; return; }
    grammarBtn.disabled = true;
    grammarBtn.textContent = 'Checking...';
    grammarResults.innerHTML = '';
    try{
      const data = await checkGrammar(textarea.value);
      if(!data.matches || data.matches.length === 0){
        grammarResults.innerHTML = '<div class="feedback good">✅ No grammar or spelling issues found!</div>';
      } else {
        grammarResults.innerHTML = data.matches.map(m => {
          const snippet = m.context ? m.context.text.slice(Math.max(0,m.context.offset-15), m.context.offset+m.context.length+15) : '';
          const suggestions = (m.replacements||[]).slice(0,3).map(r=>r.value).join(', ');
          return '<div class="feedback bad" style="margin-bottom:8px;">' +
            '❌ ' + m.message +
            (snippet ? '<div class="heard">"...' + snippet + '..."</div>' : '') +
            (suggestions ? '<div class="heard">Suggestion: <b>' + suggestions + '</b></div>' : '') +
            '</div>';
        }).join('');
      }
    }catch(e){
      grammarResults.innerHTML = '<p class="small">⚠️ Could not reach the grammar checker (it\'s a free public service — try again in a moment).</p>';
    }
    grammarBtn.disabled = false;
    grammarBtn.textContent = '✓ Check grammar';
  };
  btnRow.appendChild(grammarBtn);

  const modelBtn = document.createElement('button');
  modelBtn.className = 'action btn-ghost';
  modelBtn.textContent = 'Show model example';
  const modelBox = document.createElement('div');
  modelBox.className = 'model-answer';
  modelBox.innerHTML = `<b>${item.model}</b><br><span class="small">${item.modelEn}</span>`;
  modelBtn.onclick = ()=>{
    modelBox.classList.toggle('show');
    if(modelBox.classList.contains('show')) speak(item.model);
  };
  btnRow.appendChild(modelBtn);

  const doneBtn = document.createElement('button');
  doneBtn.className = 'action btn-next';
  doneBtn.textContent = practiced ? '✅ Practiced' : 'Mark as practiced';
  doneBtn.onclick = ()=>{
    writingLog[writingIdx] = true;
    saveWritingLog(writingLog);
    render();
  };
  btnRow.appendChild(doneBtn);

  card.appendChild(btnRow);
  card.appendChild(grammarResults);
  card.appendChild(modelBox);

  const checklistCard = document.createElement('div');
  checklistCard.className = 'card';
  checklistCard.innerHTML = `
    <p class="item-en" style="margin-bottom:6px; font-size:0.95rem;">Self-check: the other 3 official criteria</p>
    <p class="small">☐ <b>Adéquation</b> — did I actually answer what was asked?</p>
    <p class="small">☐ <b>Structure</b> — clear beginning, middle, end (or greeting → point → close)?</p>
    <p class="small">☐ <b>Lexique</b> — did I use varied, appropriate vocabulary, not just repeat the same 3 words?</p>
  `;
  card.appendChild(checklistCard);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action btn-ghost';
  nextBtn.textContent = 'Next prompt →';
  nextBtn.onclick = ()=>{ writingIdx = (writingIdx+1) % WRITING_WARMUPS_A1.length; render(); };
  nextRow.appendChild(nextBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

function renderConversation(main, nav){
  nav.innerHTML = '';
  if(!conversationUnlocked()){
    const pendingBlock = anyPending(['sent:', 'verb:']);
    lockedCard(main, 'Conversation (TCF/TEF)',
      countSolidSentences() + countSolidVerbs(),
      UNLOCK.conversation.sentSolid + UNLOCK.conversation.verbSolid,
      pendingBlock
        ? "You've got pending sentences or verb forms that haven't been demonstrated yet — clear those first (Start Today's Session will show only pending items until they're gone)."
        : "Real conversation needs sentences that are solid both ways — read aloud AND recalled from English (🔀 Test me on Sentences) — plus solid verb conjugation. Get those locked in and this unlocks automatically.",
      'sentences', 'Go practice Sentences');
    return;
  }
  Object.keys(CONVERSATION).forEach(key=>{
    const b = document.createElement('button');
    b.textContent = CONVERSATION[key].label;
    if(key===convExam) b.classList.add('active');
    b.onclick = ()=>{ convExam=key; convTaskIdx=0; convPromptIdx=0; render(); };
    nav.appendChild(b);
  });

  const exam = CONVERSATION[convExam];
  const task = exam.tasks[convTaskIdx];
  const prompt = task.prompts[convPromptIdx];

  main.innerHTML = '';

  const taskNav = document.createElement('div');
  taskNav.className = 'sub-tabs';
  exam.tasks.forEach((t,i)=>{
    const b = document.createElement('button');
    b.textContent = t.title.split('—')[0].trim();
    if(i===convTaskIdx) b.classList.add('active');
    b.onclick = ()=>{ convTaskIdx=i; convPromptIdx=0; render(); };
    taskNav.appendChild(b);
  });
  main.appendChild(taskNav);

  const key = 'conv:'+convExam+':'+convTaskIdx+':'+convPromptIdx;
  const stage = stageInfo(getItemProgress(key).box);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="pill">${task.title}</div>
    <span class="stage-pill ${stage.cls}">${stage.label}</span>
    <p class="small" style="margin-top:8px;">${task.desc}</p>
    <div class="progress-line">Question ${convPromptIdx+1} of ${task.prompts.length}</div>
    <p class="item-fr" style="font-size:1.15rem;">${prompt.fr}</p>
    <p class="item-en">${prompt.en}</p>
  `;

  const widget = practiceWidget(prompt.fr, null, {keywordSets: prompt.keywords, progressKey: key});
  card.appendChild(widget);

  const modelBtn = document.createElement('button');
  modelBtn.className = 'action btn-ghost';
  modelBtn.style.marginTop = '10px';
  modelBtn.textContent = 'Show model answer';
  const modelBox = document.createElement('div');
  modelBox.className = 'model-answer';
  modelBox.innerHTML = `<b>Model answer:</b><br>${prompt.model}`;
  modelBtn.onclick = ()=>{
    modelBox.classList.toggle('show');
    if(modelBox.classList.contains('show')) speak(prompt.model);
  };
  card.appendChild(modelBtn);
  card.appendChild(modelBox);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action btn-next';
  nextBtn.textContent = 'Next question →';
  nextBtn.onclick = ()=>{
    convPromptIdx++;
    if(convPromptIdx>=task.prompts.length){ convPromptIdx=0; }
    render();
  };
  nextRow.appendChild(nextBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Add tab ---------- */
function renderAdd(main, nav){
  nav.innerHTML = '<span class="small" style="padding:8px 4px;">Add words or sentences from each lesson</span>';
  main.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <p class="item-en" style="margin-bottom:10px;">Add a new item</p>
    <select id="addType">
      <option value="vocab">Vocabulary word</option>
      <option value="sentences">Full sentence</option>
    </select>
    <input type="text" id="addFr" placeholder="French (e.g. le stylo)">
    <input type="text" id="addEn" placeholder="English meaning">
    <input type="text" id="addCat" placeholder="Category (vocab only, e.g. Verbes)">
    <div class="btn-row">
      <button class="action btn-next" id="addBtn">Add</button>
    </div>
  `;
  main.appendChild(card);

  document.getElementById('addBtn').onclick = ()=>{
    const type = document.getElementById('addType').value;
    const fr = document.getElementById('addFr').value.trim();
    const en = document.getElementById('addEn').value.trim();
    const cat = document.getElementById('addCat').value.trim() || 'Ajouté';
    if(!fr || !en) return;
    if(type==='vocab'){ custom.vocab.push({cat, fr, en}); }
    else{ custom.sentences.push({fr, en}); }
    saveCustom(custom);
    document.getElementById('addFr').value='';
    document.getElementById('addEn').value='';
    document.getElementById('addCat').value='';
    renderAddList();
  };

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.id = 'addListCard';
  main.appendChild(listCard);
  renderAddList();

  const fileCard = document.createElement('div');
  fileCard.className = 'card';
  if(fileBackupSupported){
    fileCard.innerHTML = `
      <p class="item-en" style="margin-bottom:4px;">Local file backup</p>
      <p class="small" style="margin-bottom:12px;">
        Link a real file on this device (e.g. in Downloads). Every change auto-saves there too —
        it survives a browser cache/site-data clear because it isn't stored inside the browser at all.
        This is per-device, not cross-device — use Export/Import below to move progress between phones.
      </p>
      <p class="small" id="fileStatus" style="margin-bottom:10px;">${linkedFileHandle ? '🔗 Linked' : (needsReconnect ? '⚠️ Was linked — needs reconnecting' : 'Not linked yet')}</p>
      <div class="btn-row">
        <button class="action btn-play" id="linkFileBtn">${linkedFileHandle ? '🔗 Re-link a different file' : (needsReconnect ? '🔄 Reconnect backup file' : '📁 Set up local file backup')}</button>
      </div>
    `;
  } else {
    fileCard.innerHTML = `
      <p class="item-en" style="margin-bottom:4px;">Local file backup</p>
      <p class="small">Not available in this browser (Safari/iOS doesn't support it). Use Export/Import below instead.</p>
    `;
  }
  main.appendChild(fileCard);
  if(fileBackupSupported){
    document.getElementById('linkFileBtn').onclick = async ()=>{
      const statusEl = document.getElementById('fileStatus');
      let ok;
      if(needsReconnect){ ok = await reconnectBackupFile(); if(ok) await writeBackupNow(); }
      else { ok = await linkBackupFile(); }
      statusEl.textContent = ok ? '🔗 Linked' : 'Could not link — try again.';
      renderAdd(main, nav);
    };
  }

  const syncCard = document.createElement('div');
  syncCard.className = 'card';
  syncCard.innerHTML = `
    <p class="item-en" style="margin-bottom:4px;">Sync across devices</p>
    <p class="small" style="margin-bottom:12px;">
      Progress lives only in this browser on this device — there's no server behind this app.
      To bring it to another phone or computer: export here, then paste the same text into
      Import on the other device. Whichever device is further ahead on each word wins the merge,
      so it's safe to do this in either direction.
    </p>
    <div class="btn-row">
      <button class="action btn-play" id="exportBtn">📤 Export progress</button>
    </div>
    <textarea id="exportBox" rows="3" style="display:none; margin-top:10px;" readonly></textarea>
    <p class="small" id="exportHint" style="display:none;">Copy this text and send it to your other device (e.g. via WhatsApp/Notes to self).</p>
    <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:14px;">
      <p class="item-en" style="margin-bottom:8px; font-size:0.95rem;">Import from another device</p>
      <textarea id="importBox" rows="3" placeholder="Paste exported text here..."></textarea>
      <div class="btn-row">
        <button class="action btn-next" id="importBtn">📥 Import & merge</button>
      </div>
      <p class="small" id="importResult" style="margin-top:8px;"></p>
    </div>
  `;
  main.appendChild(syncCard);

  document.getElementById('exportBtn').onclick = ()=>{
    const payload = {
      exportedAt: new Date().toISOString(),
      progress: progress,
      custom: custom,
      stats: stats
    };
    const json = JSON.stringify(payload);
    const box = document.getElementById('exportBox');
    box.value = json;
    box.style.display = 'block';
    document.getElementById('exportHint').style.display = 'block';
    box.focus();
    box.select();
    try{ document.execCommand('copy'); document.getElementById('exportHint').textContent = 'Copied to clipboard — paste it into Import on your other device.'; }
    catch(e){ /* selection is shown either way, manual copy still works */ }
  };

  document.getElementById('importBtn').onclick = ()=>{
    const resultEl = document.getElementById('importResult');
    const raw = document.getElementById('importBox').value.trim();
    if(!raw){ resultEl.textContent = 'Paste exported text first.'; return; }
    let incoming;
    try{ incoming = JSON.parse(raw); }
    catch(e){ resultEl.textContent = "That doesn't look like valid exported text."; return; }

    const { updated, kept, addedWords } = mergeIncoming(incoming);
    resultEl.textContent = `Merged: ${updated} items updated, ${kept} already further ahead here, ${addedWords} custom entries added. Your streak stays local to this device.`;
    document.getElementById('importBox').value = '';
  };

  function renderAddList(){
    const lc = document.getElementById('addListCard');
    lc.innerHTML = '<p class="item-en">Your added items</p>';
    const combined = [
      ...custom.vocab.map((v,i)=>({...v, kind:'vocab', idx:i})),
      ...custom.sentences.map((s,i)=>({...s, kind:'sentences', idx:i}))
    ];
    if(combined.length===0){ lc.innerHTML += '<p class="small">Nothing added yet.</p>'; return; }
    combined.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `<span>${item.fr} <span class="small">— ${item.en}</span></span>`;
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.onclick = ()=>{
        custom[item.kind].splice(item.idx,1);
        saveCustom(custom);
        renderAddList();
      };
      row.appendChild(del);
      lc.appendChild(row);
    });
  }
}

/* ---------- Init ---------- */
try{
  if(!SpeechRecognitionAPI){
    const w = document.createElement('div');
    w.className = 'warn';
    w.innerHTML = '⚠️ Speech recognition isn\'t supported in this browser. Use <b>Chrome on Android</b> for the "Say it" mic feature — pronunciation playback will still work everywhere.';
    document.body.insertBefore(w, document.getElementById('mainNav').nextSibling);
  }
}catch(e){}

function checkVoiceAvailability(){
  if(!synth) return;
  if(!hasFrenchVoice()){
    if(document.getElementById('noVoiceWarn')) return;
    const w = document.createElement('div');
    w.className = 'warn';
    w.id = 'noVoiceWarn';
    w.innerHTML = '⚠️ No French voice found on this device, so "Hear it" will stay silent. Install one: Android Settings → System → Languages & input → Text-to-speech output → Google Text-to-Speech → Install voice data → French.';
    document.body.insertBefore(w, document.getElementById('mainNav').nextSibling);
  } else {
    const existing = document.getElementById('noVoiceWarn');
    if(existing) existing.remove();
  }
}
setTimeout(checkVoiceAvailability, 600);
if(synth){ try{ synth.addEventListener('voiceschanged', checkVoiceAvailability); }catch(e){} }

try{
  render();
}catch(e){
  document.getElementById('mainContent').innerHTML =
    '<div class="card"><p class="item-en">Something didn\'t load right: ' +
    (e && e.message ? e.message : 'unknown error') +
    '</p><p class="small">Try reloading the page.</p></div>';
}

if(fileBackupSupported){
  tryRestoreLinkedFile().then(result=>{
    if(result && (result.updated > 0 || result.addedWords > 0)){
      try{ render(); }catch(e){}
    }
  }).catch(()=>{});
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if unavailable, e.g. on claude.ai preview */ });
  });
}
</script>
