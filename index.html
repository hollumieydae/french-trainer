/* ---------- Speech setup ---------- */
const synth = (typeof window !== 'undefined' && window.speechSynthesis) ? window.speechSynthesis : null;
let frVoice = null;
function loadVoice(){
  if(!synth) return;
  try{
    const voices = synth.getVoices();
    frVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('fr')) || null;
  }catch(e){ /* ignore — playback will just use default voice/lang */ }
}
try{ loadVoice(); }catch(e){}
if (synth){ try{ synth.onvoiceschanged = loadVoice; }catch(e){} }

function speak(text){
  if(!synth){
    alert("This browser doesn't support text-to-speech playback.");
    return;
  }
  try{ synth.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  if(frVoice) u.voice = frVoice;
  u.rate = 0.92;
  u.onerror = (e)=>{
    console.log('TTS error', e);
  };
  try{ synth.speak(u); }catch(e){ alert('Playback failed: '+ (e.message||e)); }
}
function hasFrenchVoice(){
  if(!synth) return false;
  try{
    const voices = synth.getVoices();
    return voices.some(v=>v.lang && v.lang.toLowerCase().startsWith('fr'));
  }catch(e){ return false; }
}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let recognizing = false;
function getRecognizer(onResult, onEnd){
  if(!SpeechRecognitionAPI) return null;
  const r = new SpeechRecognitionAPI();
  r.lang = 'fr-FR';
  r.interimResults = false;
  r.maxAlternatives = 3;
  r.onresult = (e)=>{
    const alts = [];
    for(let i=0;i<e.results[0].length;i++){ alts.push(e.results[0][i].transcript); }
    onResult(alts);
  };
  r.onend = ()=>{ recognizing=false; if(onEnd) onEnd(); };
  r.onerror = (e)=>{ recognizing=false; if(onEnd) onEnd(e.error || 'error'); };
  return r;
}

function normalize(s){
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[.,!?;:'"’]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function isMatch(target, said){
  return normalize(target) === normalize(said);
}
function keywordMatch(said, keywordSets){
  const n = normalize(said);
  return keywordSets.some(set => set.every(kw => n.includes(normalize(kw))));
}

/* ---------- Storage ---------- */
function loadCustom(){
  try{
    return JSON.parse(localStorage.getItem('frt_custom')||'{"vocab":[],"sentences":[]}');
  }catch(e){ return {vocab:[],sentences:[]}; }
}
function saveCustom(data){
  try{ localStorage.setItem('frt_custom', JSON.stringify(data)); }catch(e){}
}
let custom = loadCustom();

function loadStreak(){
  try{ return JSON.parse(localStorage.getItem('frt_stats')||'{"correct":0,"attempts":0}'); }
  catch(e){ return {correct:0,attempts:0}; }
}
function saveStreak(s){ try{ localStorage.setItem('frt_stats', JSON.stringify(s)); }catch(e){} }
let stats = loadStreak();
function recordAttempt(ok){
  stats.attempts++; if(ok) stats.correct++;
  saveStreak(stats);
}

function render(){
  const main = document.getElementById('mainContent');

  nav.innerHTML = '';
  if(currentTab === 'vocab') renderVocab(main, nav);
  else if(currentTab === 'verbs') renderVerbs(main, nav);
  else if(currentTab === 'sentences') renderSentences(main, nav);
  else if(currentTab === 'conversation') renderConversation(main, nav);
  else if(currentTab === 'add') renderAdd(main, nav);
}

  const wrap = document.createElement('div');
  const micSupported = !!SpeechRecognitionAPI;

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  const playBtn = document.createElement('button');
  playBtn.className = 'action btn-play';
  playBtn.innerHTML = '🔊 Hear it';
  playBtn.onclick = ()=> speak(targetText);
  btnRow.appendChild(playBtn);

  const micBtn = document.createElement('button');
  micBtn.className = 'action btn-mic';
  micBtn.innerHTML = micSupported ? '🎤 Say it' : '🎤 Not supported';
  micBtn.disabled = !micSupported;
  btnRow.appendChild(micBtn);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';

  micBtn.onclick = ()=>{
    if(recognizing) return;
    recognizing = true;
    micBtn.classList.add('listening');
    micBtn.innerHTML = '🔴 Listening...';
    const rec = getRecognizer((alts)=>{
      const said = alts[0] || '';
      let ok;
      if(opts.keywordSets){
        ok = alts.some(a=>keywordMatch(a, opts.keywordSets));
      } else {
        ok = alts.some(a=>isMatch(targetText, a));
      }
      recordAttempt(ok);
      feedback.className = 'feedback ' + (ok ? 'good' : 'bad');
      feedback.innerHTML = (ok ? '✅ Nice — that matched!' : '❌ Not quite — listen again and retry.') +
        '<div class="heard">You said: "' + said + '"</div>';
      if(ok && onCorrect) onCorrect();
      if(!ok){ setTimeout(()=>speak(targetText), 400); }
    }, (err)=>{
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎤 Say it';
      if(err){
        feedback.className = 'feedback bad';
        let msg = "⚠️ Couldn't hear you — try again.";
        if(err === 'not-allowed' || err === 'service-not-allowed'){
          msg = "⚠️ Microphone permission is blocked. Tap the 🔒/ⓘ icon next to the address bar → Permissions → Microphone → Allow, then reload the page.";
        } else if(err === 'no-speech'){
          msg = "⚠️ Didn't catch any speech — tap 🎤 and speak right after it turns red.";
        } else if(err === 'audio-capture'){
          msg = "⚠️ No microphone was found. Check that no other app is using it.";
        } else if(err === 'network'){
          msg = "⚠️ Speech recognition needs an internet connection — check your connection and retry.";
        }
        feedback.innerHTML = msg;
      }
    });
    if(!rec){ recognizing=false; return; }
    recognizer = rec;
    try{ rec.start(); }catch(e){ recognizing=false; }
    rec.onend = ()=>{
      recognizing = false;
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎤 Say it';
    };
  };

  wrap.appendChild(btnRow);
  wrap.appendChild(feedback);
  return wrap;
}

/* ---------- Vocab tab ---------- */
function renderVocab(main, nav){
  const cats = ['Tous', ...new Set(allVocab().map(v=>v.cat))];
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.textContent = c;
    if(c===vocabCat) b.classList.add('active');
    b.onclick = ()=>{ vocabCat=c; vocabIndex=0; render(); };
    nav.appendChild(b);
  });

  const list = vocabCat==='Tous' ? allVocab() : allVocab().filter(v=>v.cat===vocabCat);
  if(vocabIndex>=list.length) vocabIndex=0;
  const item = list[vocabIndex];

  main.innerHTML = '';
  if(!item){ main.innerHTML = '<div class="card">No words yet in this category.</div>'; return; }

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="pill">${item.cat}</div>
    <div class="progress-line">Word ${vocabIndex+1} of ${list.length}</div>
    <p class="item-fr">${item.fr}</p>
    <p class="item-en">${item.en}</p>
  `;
  const widget = practiceWidget(item.fr, ()=>{
    setTimeout(()=>{ vocabIndex = (vocabIndex+1)%list.length; render(); }, 900);
  });
  card.appendChild(widget);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const skipBtn = document.createElement('button');
  skipBtn.className = 'action btn-ghost';
  skipBtn.textContent = 'Skip →';
  skipBtn.onclick = ()=>{ vocabIndex=(vocabIndex+1)%list.length; render(); };
  nextRow.appendChild(skipBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Verbs tab ---------- */
function renderVerbs(main, nav){
  ['present','pc'].forEach(mode=>{
    const b = document.createElement('button');
    b.textContent = mode==='present' ? 'Présent' : 'Passé composé';
    if(mode===verbMode) b.classList.add('active');
    b.onclick = ()=>{ verbMode=mode; render(); };
    nav.appendChild(b);
  });

  const verbsAvailable = VERBS.filter(v=> verbMode==='present' || v.pc);
  if(verbIndex>=verbsAvailable.length) verbIndex=0;
  const verb = verbsAvailable[verbIndex];
  const forms = verbMode==='present' ? verb.present : verb.pc;

  main.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="progress-line">Verb ${verbIndex+1} of ${verbsAvailable.length}</div>
    <p class="item-fr">${verb.inf}</p>
    <p class="item-en">${verb.en}</p>
  `;

  const grid = document.createElement('div');
  grid.className = 'conj-grid';
  Object.keys(forms).forEach(subj=>{
    const cell = document.createElement('div');
    cell.className = 'conj-cell';
    const full = (subj==='je' && forms[subj][0].match(/[aeiouyéèêh]/i)) ? "J'"+forms[subj] : SUBJECTS[subj]+' '+forms[subj];
    cell.innerHTML = `<b>${SUBJECTS[subj]}</b>${full}`;
    grid.appendChild(cell);
  });
  card.appendChild(grid);

  const sel = document.createElement('div');
  sel.className = 'small';
  sel.textContent = 'Tap a pronoun below to practice that form:';
  card.appendChild(sel);

  const pronRow = document.createElement('div');
  pronRow.className = 'sub-tabs';
  let activeSubj = Object.keys(forms)[0];
  Object.keys(forms).forEach(subj=>{
    const b = document.createElement('button');
    b.textContent = SUBJECTS[subj];
    if(subj===activeSubj) b.classList.add('active');
    b.onclick = ()=>{ activeSubj=subj; buildPractice(); };
    pronRow.appendChild(b);
  });
  card.appendChild(pronRow);

  const practiceHolder = document.createElement('div');
  card.appendChild(practiceHolder);

  function buildPractice(){
    pronRow.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.textContent===SUBJECTS[activeSubj]));
    practiceHolder.innerHTML = '';
    const full = (activeSubj==='je' && forms[activeSubj][0].match(/[aeiouyéèêh]/i)) ? "J'"+forms[activeSubj] : SUBJECTS[activeSubj]+' '+forms[activeSubj];
    practiceHolder.appendChild(practiceWidget(full));
  }
  buildPractice();

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action btn-next';
  nextBtn.textContent = 'Next verb →';
  nextBtn.onclick = ()=>{ verbIndex=(verbIndex+1)%verbsAvailable.length; render(); };
  nextRow.appendChild(nextBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Sentences tab ---------- */
function renderSentences(main, nav){

  const list = allSentences();
  if(sentIndex>=list.length) sentIndex=0;
  const s = list[sentIndex];

  main.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="progress-line">Sentence ${sentIndex+1} of ${list.length}</div>
    <p class="item-fr" style="font-size:1.15rem;">${s.fr}</p>
    <p class="item-en">${s.en}</p>
  `;
  const widget = practiceWidget(s.fr, ()=>{
    setTimeout(()=>{ sentIndex=(sentIndex+1)%list.length; render(); }, 900);
  });
  card.appendChild(widget);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const skipBtn = document.createElement('button');
  skipBtn.className = 'action btn-ghost';
  skipBtn.textContent = 'Skip →';
  skipBtn.onclick = ()=>{ sentIndex=(sentIndex+1)%list.length; render(); };
  nextRow.appendChild(skipBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Conversation tab ---------- */
function renderConversation(main, nav){
  Object.keys(CONVERSATION).forEach(key=>{
    const b = document.createElement('button');
    b.textContent = CONVERSATION[key].label;
    if(key===convExam) b.classList.add('active');
    b.onclick = ()=>{ convExam=key; convTaskIdx=0; convPromptIdx=0; render(); };
    nav.appendChild(b);
  });

  const exam = CONVERSATION[convExam];
  const task = exam.tasks[convTaskIdx];
  const prompt = task.prompts[convPromptIdx];

  main.innerHTML = '';

  const taskNav = document.createElement('div');
  taskNav.className = 'sub-tabs';
  exam.tasks.forEach((t,i)=>{
    const b = document.createElement('button');
    b.textContent = t.title.split('—')[0].trim();
    if(i===convTaskIdx) b.classList.add('active');
    b.onclick = ()=>{ convTaskIdx=i; convPromptIdx=0; render(); };
    taskNav.appendChild(b);
  });
  main.appendChild(taskNav);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="pill">${task.title}</div>
    <p class="small">${task.desc}</p>
    <div class="progress-line">Question ${convPromptIdx+1} of ${task.prompts.length}</div>
    <p class="item-fr" style="font-size:1.15rem;">${prompt.fr}</p>
    <p class="item-en">${prompt.en}</p>
  `;

  const widget = practiceWidget(prompt.fr, null, {keywordSets: prompt.keywords});
  card.appendChild(widget);

  const modelBtn = document.createElement('button');
  modelBtn.className = 'action btn-ghost';
  modelBtn.style.marginTop = '10px';
  modelBtn.textContent = 'Show model answer';
  const modelBox = document.createElement('div');
  modelBox.className = 'model-answer';
  modelBox.innerHTML = `<b>Model answer:</b><br>${prompt.model}`;
  modelBtn.onclick = ()=>{
    modelBox.classList.toggle('show');
    if(modelBox.classList.contains('show')) speak(prompt.model);
  };
  card.appendChild(modelBtn);
  card.appendChild(modelBox);

  const nextRow = document.createElement('div');
  nextRow.className = 'btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action btn-next';
  nextBtn.textContent = 'Next question →';
  nextBtn.onclick = ()=>{
    convPromptIdx++;
    if(convPromptIdx>=task.prompts.length){ convPromptIdx=0; }
    render();
  };
  nextRow.appendChild(nextBtn);
  card.appendChild(nextRow);

  main.appendChild(card);
}

/* ---------- Add tab ---------- */
function renderAdd(main, nav){
  nav.innerHTML = '<span class="small" style="padding:8px 4px;">Add words or sentences from each lesson</span>';
  main.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <p class="item-en" style="margin-bottom:10px;">Add a new item</p>
    <select id="addType">
      <option value="vocab">Vocabulary word</option>
      <option value="sentences">Full sentence</option>
    </select>
    <input type="text" id="addFr" placeholder="French (e.g. le stylo)">
    <input type="text" id="addEn" placeholder="English meaning">
    <input type="text" id="addCat" placeholder="Category (vocab only, e.g. Verbes)">
    <div class="btn-row">
      <button class="action btn-next" id="addBtn">Add</button>
    </div>
  `;
  main.appendChild(card);

  document.getElementById('addBtn').onclick = ()=>{
    const type = document.getElementById('addType').value;
    const fr = document.getElementById('addFr').value.trim();
    const en = document.getElementById('addEn').value.trim();
    const cat = document.getElementById('addCat').value.trim() || 'Ajouté';
    if(!fr || !en) return;
    if(type==='vocab'){ custom.vocab.push({cat, fr, en}); }
    else{ custom.sentences.push({fr, en}); }
    saveCustom(custom);
    document.getElementById('addFr').value='';
    document.getElementById('addEn').value='';
    document.getElementById('addCat').value='';
    renderAddList();
  };

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.id = 'addListCard';
  main.appendChild(listCard);
  renderAddList();

  function renderAddList(){
    const lc = document.getElementById('addListCard');
    lc.innerHTML = '<p class="item-en">Your added items</p>';
    const combined = [
      ...custom.vocab.map((v,i)=>({...v, kind:'vocab', idx:i})),
      ...custom.sentences.map((s,i)=>({...s, kind:'sentences', idx:i}))
    ];
    if(combined.length===0){ lc.innerHTML += '<p class="small">Nothing added yet.</p>'; return; }
    combined.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `<span>${item.fr} <span class="small">— ${item.en}</span></span>`;
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.onclick = ()=>{
        custom[item.kind].splice(item.idx,1);
        saveCustom(custom);
        renderAddList();
      };
      row.appendChild(del);
      lc.appendChild(row);
    });
  }
}

/* ---------- Init ---------- */
try{
  if(!SpeechRecognitionAPI){
    const w = document.createElement('div');
    w.className = 'warn';
    w.innerHTML = '⚠️ Speech recognition isn\'t supported in this browser. Use <b>Chrome on Android</b> for the "Say it" mic feature — pronunciation playback will still work everywhere.';
    document.body.insertBefore(w, document.getElementById('mainNav').nextSibling);
  }
}catch(e){}

function checkVoiceAvailability(){
  if(!synth) return;
  if(!hasFrenchVoice()){
    if(document.getElementById('noVoiceWarn')) return;
    const w = document.createElement('div');
    w.className = 'warn';
    w.id = 'noVoiceWarn';
    w.innerHTML = '⚠️ No French voice found on this device, so "Hear it" will stay silent. Install one: Android Settings → System → Languages & input → Text-to-speech output → Google Text-to-Speech → Install voice data → French.';
    document.body.insertBefore(w, document.getElementById('mainNav').nextSibling);
  } else {
    const existing = document.getElementById('noVoiceWarn');
    if(existing) existing.remove();
  }
}
setTimeout(checkVoiceAvailability, 600);
if(synth){ try{ synth.addEventListener('voiceschanged', checkVoiceAvailability); }catch(e){} }

try{
  render();
}catch(e){
  document.getElementById('mainContent').innerHTML =
    '<div class="card"><p class="item-en">Something didn\'t load right: ' +
    (e && e.message ? e.message : 'unknown error') +
    '</p><p class="small">Try reloading the page.</p></div>';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if unavailable, e.g. on claude.ai preview */ });
  });
}
